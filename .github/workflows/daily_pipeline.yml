name: AlphaTech Automated Daily Quantitative Pipeline

on:
  schedule:
    # Run Sunday to Thursday at 22:17 UTC (Monday to Friday 05:17 WIB before market opens, avoiding peak 00-min congestion)
    - cron: '17 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Quantitative Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt

      - name: Step 1 - Ingest Market Data
        run: python -m src.01_data_ingestion

      - name: Step 2 - Feature Engineering & Alpha Extraction
        run: python -m src.02_feature_eng

      - name: Step 3 - Model Training & Alpha Inference
        run: python -m src.03_model_inference

      - name: Step 4 - Institutional Morning Market Brief & Watchlist Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.morning_brief

      - name: Commit & Push Processed Alpha Recommendations & Briefs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/processed/ data/raw/benchmark_market_data.csv data/raw/global_macro_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily alpha recommendations & morning brief [skip ci]" && git push)
